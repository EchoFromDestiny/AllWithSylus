<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>All With Sylus</title>
    <!-- 引入外部 CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>文章列表</h1>
    
    <!-- ========== 悬浮面板 ========== -->
    <div id="theme-panel" style="display:none;">
        <div class="panel-header">
            <span>背景与透明度</span>
            <button id="panel-close">✕</button>
        </div>
        <div class="panel-body">
            <!-- 预设背景 -->
            <div class="panel-section">
                <label>背景图</label>
                <div class="bg-grid" id="bg-grid">
                    <!-- 由 JavaScript 动态生成 -->
                </div>
            </div>
            <!-- 透明度 -->
            <div class="panel-section">
                <label>透明度 <span id="opacity-value-panel">100%</span></label>
                <input type="range" id="opacity-slider" min="50" max="100" value="100">
            </div>
        </div>
    </div>
    
    <!-- 遮罩层 -->
    <div id="panel-overlay" style="display:none;"></div>

    <!-- 搜索框 -->
    <input type="text" id="search" placeholder="搜索文章标题...">

    <!-- 导航路径 -->
    <!-- 导航路径 + 背景切换按钮 -->
    <div id="breadcrumb">
        <div class="breadcrumb-left">
            <span id="home-btn" style="cursor:pointer;color:#1a0dab;font-weight:600;">首页</span>
            <span id="breadcrumb-path"></span>
        </div>
        <button id="theme-toggle">选择背景</button>
    </div>

    <!-- 文章树 -->
    <div id="tree-container"></div>

    <!-- 文章正文 -->
    <div id="post-content">
        <div id="post-nav-top">
            <span id="back-btn">← 返回列表</span>
        </div>
        <!-- 加载提示 -->
        <div id="loading-placeholder" style="display: none; text-align: center; padding: 60px 20px;">
            <div class="loader"></div>
            <div style="color: #999; font-size: 14px; margin-top: 16px; font-family: '宋体', 'SimSun', serif;">加载中...</div>
        </div>
        <div id="article-body"></div>
        <div id="post-nav-bottom">
            <span id="prev-article" class="nav-btn">上一篇</span>
            <span id="back-to-level" class="nav-btn">返回上一级</span>
            <span id="next-article" class="nav-btn">下一篇</span>
        </div>
    </div>

    <!-- 版权声明 -->
    <div id="footer">
        <p>© Copyright EchoFromDestiny 2025-<span id="current-year"></span></p>
    </div>

    <!-- 引入外部 JavaScript -->
    <script src="script.js"></script>
</body>
</html>
