<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>All With Sylus</title>
    <!-- 引入外部 CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>文章列表</h1>

    <!-- 搜索框 -->
    <input type="text" id="search" placeholder="搜索文章标题...">

    <!-- 导航路径 -->
    <div id="breadcrumb">
        <span id="home-btn" style="cursor:pointer;color:#1a0dab;font-weight:600;">首页</span>
        <span id="breadcrumb-path"></span>
    </div>

    <!-- 文章树 -->
    <div id="tree-container"></div>

    <!-- 文章正文 -->
    <div id="post-content">
        <div id="post-nav-top">
            <span id="back-btn">← 返回列表</span>
            <span id="home-btn-from-article">首页</span>
        </div>
        <!-- ========== 加载提示 ========== -->
        <div id="loading-placeholder" style="display: none; text-align: center; padding: 40px 20px; color: #999; font-size: 16px;">
            <div style="font-size: 28px; margin-bottom: 12px;">⏳</div>
            <div>文章加载中...</div>
        </div>
        <div id="article-body"></div>
        <div id="post-nav-bottom">
            <span id="prev-article" class="nav-btn">≪ 上一篇</span>
            <span id="back-to-level" class="nav-btn">返回上一级</span>
            <span id="next-article" class="nav-btn">下一篇 ≫</span>
        </div>
    </div>

    <!-- 版权声明 -->
    <div id="footer">
        <p>© Copyright EchoFromDestiny 2025-<span id="current-year"></span></p>
    </div>

    <!-- 引入外部 JavaScript -->
    <script src="script.js"></script>
</body>
</html>
